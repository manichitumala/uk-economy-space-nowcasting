[project]
name = "uk-economy-space-nowcasting"
version = "1.0.0"
description = "Point-in-time test of whether VIIRS night-time lights improve nowcasts of UK regional GDP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
